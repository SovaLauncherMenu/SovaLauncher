
<!DOCTYPE html>

  <title>SovaLauncher</title>

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101010;

    }
    header {
      padding: 22px;
      border-bottom: 1px solid #333;
      font-size: 24px;
      font-weight: bold;
    }
    main {
      max-width: 850px;
      margin: 90px auto;

      text-align: center;
    }
    h1 { font-size: clamp(38px, 8vw, 64px); }

      display: inline-block;

      padding: 14px 24px;
      background: #fff;
      color: #111;

      text-decoration: none;
      font-weight: bold;

<body>
  <header>🦉 SovaLauncher</header>
  <main>
    <h1>Твой Minecraft.<br>Твои правила.</h1>

       и создание собственных игровых сборок.</p>

       href="https://www.minecraft.net/"
       target="_blank" rel="noopener">
       Minecraft
